  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;

    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();

      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }

      },
    );

    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(

  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const fileElement = document.getElementById(&quot;codex-preview-files&quot;);
  const connectorGlobals = {};
  if (bindingElement != null || mockElement != null || fileElement != null) {

    while (pending.length) {

      }
    }
    const updates = [];
    if (mockElement != null) {
      const mocks = Object.entries(parse(mockElement.textContent));
      mockElement.remove();
      for (const [name, value] of mocks) {
        values.set(name, value);
        updates.push({ name, revision: 1, state: &quot;ready&quot;, value: { type: &quot;json&quot;, value } });
      }
    }
    if (fileElement != null) {
      const files = parse(fileElement.textContent);
      fileElement.remove();
      const blobs = new Map();
      const urls = [];
      for (const [name, binding] of Object.entries(bindings)) {
        if (binding.type !== &quot;file&quot; || !hasOwn(files, binding.path)) continue;

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */

        return () =&gt; {};

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||

        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }

            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

    },
    { capture: true },
  );

    }

      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }

    }

        id = decodeURIComponent(href.slice(1));

      }

      });

#pr-nine .phone{--red:#e8262f;--button-red:#d81e28;--cyan:#22d3ee;--surface:#141416;--border:#2a2a2e;--muted:#9a9ca3;width:100%;height:844px;position:relative;isolation:isolate;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:28px;background:#000;color:#fff;font:500 15px/1.4 system-ui,sans-serif;color-scheme:dark}

#pr-nine h2{font-size:18px;line-height:1.25;font-weight:750}

#pr-nine small{display:block;font-size:13px}
#pr-nine svg:not(.chart svg){width:18px;height:18px;flex:none}
#pr-nine .status,#pr-nine .top,#pr-nine footer,#pr-nine .tabs,#pr-nine .home-indicator{flex:none}
#pr-nine .status{height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:13px}

#pr-nine .back{display:flex;align-items:center;gap:8px;min-height:44px;color:var(--muted);font-size:14px}
#pr-nine main{display:flex;flex:1;min-height:0;flex-direction:column;gap:16px;padding:0 16px 16px;overflow:auto;overscroll-behavior:contain}
#pr-nine main &gt; *{flex:none;min-width:0}
#pr-nine footer{display:grid;gap:8px;padding:8px 16px 0;background:#000}
#pr-nine .home-indicator{width:114px;height:4px;margin:12px auto;background:#e4e4e7;border-radius:100px}
#pr-nine .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--border);padding:4px;gap:0}

#pr-nine .action{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;width:100%;padding:8px;border-radius:14px;font-weight:750;text-align:center}

#pr-nine .identity{display:grid;justify-items:center;gap:6px;position:relative}
#pr-nine .cover{position:relative;isolation:isolate;width:100%;height:104px;overflow:hidden;border-radius:16px;background:linear-gradient(120deg,#10171d,#123945 75%,#1e5864);border:1px solid #26404a}

#pr-nine .stats strong{font-size:26px;line-height:1.1;color:var(--cyan);font-variant-numeric:tabular-nums}
#pr-nine .logout{align-self:center;min-height:44px;border:0;background:none;color:var(--cyan);font-weight:700;padding:4px 16px}
#pr-nine .positive{color:var(--cyan)}
#pr-nine .negative{color:#ff737b}
#pr-nine .activity{margin-top:8px}
#pr-nine .scrim{position:absolute;inset:0;background:#0008;z-index:2}
#pr-nine .plans-sheet{position:absolute;z-index:3;bottom:0;left:0;right:0;display:grid;gap:12px;padding:10px 16px 28px;border:1px solid #38383f;border-radius:24px 24px 0 0;background:#18181b}
#pr-nine .sheet-handle{justify-self:center;width:34px;height:4px;background:#71717b;border-radius:100px}

#pr-nine .chart-card,#pr-nine .plan-card,#pr-nine .form-card{padding:16px;display:grid;gap:12px}

#pr-nine .chart-scale{display:flex;flex-direction:column;justify-content:space-between;padding-bottom:3px}

#pr-nine .plan-title{display:flex;align-items:center;gap:8px}

#pr-nine .meter{height:8px;border-radius:100px;background:#333339;overflow:hidden}
#pr-nine .meter span{display:block;width:50%;height:100%;background:var(--cyan)}
#pr-nine .plan-example{display:flex;gap:8px;align-items:flex-start;padding-top:10px;border-top:1px solid var(--border)}

#pr-nine .number{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border:1px solid #39393f;border-radius:12px}
#pr-nine .number span{padding-right:8px;border-right:1px solid #39393f}
#pr-nine .number input{min-width:0;flex:1;background:none;color:#fff;border:0}
#pr-nine .form-card label{font-weight:700}
#pr-nine .toggle{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
#pr-nine .toggle input{position:absolute;right:0;opacity:0;width:48px;height:36px}

#pr-nine .preview-details{position:relative;display:grid;gap:6px;justify-items:start;padding:0 12px 12px;overflow-wrap:anywhere}
#pr-nine .preview-details .edit-photo{margin-top:-36px}
#pr-nine .preview-details strong{font-size:21px}
#pr-nine .preview-details p:empty,#pr-nine .preview-links:empty{display:none}

#pr-nine .home-header{display:flex;align-items:center;justify-content:space-between;gap:8px}
#pr-nine .home-bell{width:44px;height:44px;display:grid;place-items:center;flex:none;border:1px solid #36363b;border-radius:13px;background:#141416;color:#fff}
#pr-nine .home-play,#pr-nine .home-activity{display:grid;gap:8px}
#pr-nine .home-play-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#pr-nine .home-play-actions .action{min-width:0;font-size:14px;overflow-wrap:anywhere}
#pr-nine .home-rating{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
#pr-nine .home-rating &gt; div{display:grid;gap:3px}
#pr-nine .home-progress{color:#a8ebf3;font-size:12px}
#pr-nine .home-stats-link{display:flex;align-items:center;gap:8px;min-height:44px;width:100%;padding:5px 0;border:0;border-top:1px solid #41636b;background:none;color:#f1fbfc;text-align:left}
#pr-nine .home-stats-link &gt; span{flex:1;min-width:0;font-weight:750;overflow-wrap:anywhere}
#pr-nine .home-stats-link small{font-weight:500}
#pr-nine .home-stats-link &gt; svg,#pr-nine .home-text-link svg{color:var(--cyan)}
#pr-nine .home-section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#pr-nine .home-text-link{display:flex;align-items:center;gap:3px;min-height:44px;padding:0;border:0;background:none;color:#a8ebf3;font-size:13px}
#pr-nine .home-text-link svg{width:14px;height:14px}
#pr-nine .home-next{display:grid;gap:8px;padding:16px;border-color:#644c34;background:linear-gradient(130deg,#2c2019,#171518 80%)}
#pr-nine .home-next-label{display:flex;align-items:center;gap:7px;color:#ffd294;font-size:13px;font-weight:700}
#pr-nine .home-next .action{margin-top:4px}

#pr-nine .coach-entry{width:100%;border:0;border-top:1px solid var(--border);background:transparent;color:#fff;text-align:left}
#pr-nine .coach-entry + .row{border-top:1px solid var(--border)}
#pr-nine .coach-entry &gt; svg:last-child{color:var(--muted)}
#pr-nine .home-coach .coach-entry{border-top:0}

#pr-nine .phone.profile-flow{height:874px;--muted:#b9bbc1}
.pr-nine-controls:has(#pr-nine-compact:checked) #pr-nine .phone.profile-flow{height:667px}
#pr-nine .profile-flow .top &gt; h1{font-size:30px}
#pr-nine .profile-flow .top:has(.settings) &gt; h1{font-size:34px}
#pr-nine .profile-flow .surface{border-radius:14px}
#pr-nine .profile-flow .action{min-height:44px;border-radius:12px}
#pr-nine .profile-flow .outline{background:transparent;border-color:#b9bbc1;color:#fff}
#pr-nine .profile-flow .outline svg{color:#fff}
#pr-nine .profile-flow .disabled{color:#9a9ca3}
#pr-nine .profile-flow .identity{justify-items:stretch;gap:0;overflow:hidden;background:#111419;border-color:#2a2a2e}
#pr-nine .profile-flow .identity .cover{border:0;border-radius:0}
#pr-nine .profile-flow .identity-copy{position:relative;display:grid;justify-items:start;gap:5px;padding:0 14px 14px}
#pr-nine .profile-flow .identity-copy h2{font-size:27px}
#pr-nine .profile-flow .identity-copy p{display:flex;align-items:center;gap:5px;font-size:14px}
#pr-nine .profile-flow .avatar-paddle{position:absolute;width:28px;height:28px;object-fit:contain;right:-9px;bottom:-4px}
#pr-nine .profile-flow .stats{grid-template-columns:repeat(3,minmax(0,1fr));background:radial-gradient(ellipse at top,#15313b,#141416 76%)}
#pr-nine .profile-flow .stats strong{text-shadow:0 0 14px #22d3ee70}
#pr-nine .profile-flow .stats small{font-size:12px}
#pr-nine .profile-flow .wa-toggle-copy{display:flex;align-items:center;gap:10px}
#pr-nine .profile-flow .wa-toggle-copy &gt; svg{color:var(--cyan)}
#pr-nine .profile-flow .tabs &gt; span{min-height:58px;font-size:11px}
#pr-nine .profile-flow .tab-icon{width:30px;height:30px}
#pr-nine .profile-flow .wa-overlay{background:#000a}
#pr-nine .profile-flow .wa-overlay[hidden]{display:none}
#pr-nine .profile-flow .wa-dialog,#pr-nine .profile-flow .editor-popup{max-width:350px;gap:8px;padding:16px;border:1px solid var(--border);background:var(--surface)}
#pr-nine .profile-flow .wa-dialog &gt; h2,#pr-nine .profile-flow .editor-popup &gt; h2{font-size:24px}
#pr-nine .profile-flow .editor-popup &gt; h2,#pr-nine .profile-flow .editor-popup &gt; p{text-align:center}
#pr-nine .profile-flow .wa-form{display:grid;gap:8px;text-align:left}
#pr-nine .profile-flow .wa-form label{font-weight:700}
#pr-nine .profile-flow .field-error,#pr-nine .wa-form .field-error{color:#ffadb4;font-size:13px}
#pr-nine .profile-flow .profile-action-pair{display:flex;flex-wrap:wrap;gap:8px}
#pr-nine .profile-flow .profile-action-pair .action{flex:1 0 auto;width:auto;padding-inline:12px;white-space:nowrap}
#pr-nine .profile-flow .confirmed-card{gap:12px;border-color:var(--border)}
#pr-nine .profile-flow .confirmed{gap:8px;padding:0}
#pr-nine .profile-flow .confirmed &gt; span{width:44px;height:44px;border-width:1px}
#pr-nine .profile-flow .confirmed &gt; span svg{width:21px;height:21px}
#pr-nine .profile-flow .confirmed h1{font-size:24px}
#pr-nine .profile-flow .social-logo{display:inline-block;width:15px;height:15px;flex:none;background:currentColor;mask:var(--network-icon) center/contain no-repeat}
#pr-nine .profile-flow .network-summary b,#pr-nine .profile-flow .network-field label{display:flex;align-items:center;justify-content:center;gap:5px}
#pr-nine .profile-flow .network-field label{justify-content:flex-start}
#pr-nine .profile-flow .preview-details{width:100%}
#pr-nine .profile-flow .preview-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:6px}
#pr-nine .profile-flow .preview-links .network-preview{display:flex;align-items:center;justify-content:center;min-height:44px;gap:4px;padding:4px;border:1px solid #365760;border-radius:10px;background:#13262d;color:#9aeef7;font-size:12px}
#pr-nine .profile-flow .preview-links .network-preview:disabled{background:#232326;border-color:var(--border);color:#9a9ca3}

#pr-nine .account-settings{gap:16px}

#pr-nine .shortcut-symbol{display:grid;place-items:center;width:36px;height:36px;margin-bottom:3px;border-radius:8px;color:#22d3ee;background:#10333c}
#pr-nine .coach-art .shortcut-symbol{background:#472129;color:#ff8990}
#pr-nine .home-shortcut small{max-width:65%;line-height:1.2}
#pr-nine .home-lock{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:3px 5px;border:1px solid #24616a;border-radius:8px;background:#081a20;color:#a5f3fc;font-size:11px;font-weight:700}
#pr-nine .home-lock svg{width:13px;height:13px}
#pr-nine .coach-art .home-lock{background:#29151b;border-color:#71333c;color:#ffbcc0}

#pr-nine .plan-preview { --paper:#0f0f11; --panel:#141416; --border:#2a2a2e; --muted:#b9bbc1; --red:#d81e28; --cyan:#22d3ee; --white:#fff; font: 400 14px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif; color:var(--white); }
#pr-nine .plan-preview * { box-sizing:border-box; }
#pr-nine .plan-preview [hidden] { display:none !important; }
#pr-nine .plan-preview .pp-stage { display:grid; place-items:center; padding:12px 0; }
#pr-nine .plan-preview .pp-phone { width:min(100%,402px); min-height:874px; isolation:isolate; position:relative; display:flex; flex-direction:column; justify-content:flex-end; border:1px solid #343438; border-radius:32px; overflow:hidden; background:#000; }
#pr-nine .plan-preview .pp-home { position:absolute; inset:0; padding:16px; }
#pr-nine .plan-preview .pp-status { display:flex; align-items:center; justify-content:space-between; height:44px; padding:0 12px; font-weight:650; }
#pr-nine .plan-preview .pp-signals { display:flex; gap:6px; }
#pr-nine .plan-preview .pp-signals svg { width:15px; height:15px; }
#pr-nine .plan-preview .pp-wordmark { display:block; width:116px; height:auto; margin:24px 0 6px; }
#pr-nine .plan-preview .pp-greeting { font-size:34px; font-weight:800; margin-bottom:16px; }
#pr-nine .plan-preview .pp-greeting span { color:var(--cyan); }
#pr-nine .plan-preview .pp-rating { background:linear-gradient(145deg,#091a20 40%,#103f4c); border:1px solid #228492; border-radius:16px; min-height:105px; display:flex; align-items:center; justify-content:space-between; padding:16px; }
#pr-nine .plan-preview .pp-rating span { display:block; font-weight:760; color:var(--muted); }
#pr-nine .plan-preview .pp-rating strong { font-size:45px; line-height:1.05; }
#pr-nine .plan-preview .pp-club { max-width:45%; color:var(--muted); }
#pr-nine .plan-preview .pp-home-actions { display:flex; gap:8px; margin-top:16px; }
#pr-nine .plan-preview .pp-home-actions span { display:grid; place-items:center; flex:1; border-radius:16px; border:1px solid var(--muted); min-height:48px; font-weight:750; }
#pr-nine .plan-preview .pp-home-actions span:first-child { background:var(--red); border-color:var(--red); }
#pr-nine .plan-preview .pp-veil { position:absolute; inset:0; background:rgba(0,0,0,.72); }
#pr-nine .plan-preview .pp-sheet { position:relative; display:flex; flex-direction:column; gap:16px; width:100%; padding:16px clamp(16px,6vw,24px) 20px; background:var(--paper); border:1px solid var(--border); border-width:1px 0 0; border-radius:24px 24px 0 0; }
#pr-nine .plan-preview button { background:none; color:inherit; border:0; font:inherit; }
#pr-nine .plan-preview .pp-handle, #pr-nine .plan-preview .pp-safe { height:5px; border-radius:10px; margin-inline:auto; }
#pr-nine .plan-preview .pp-handle { width:44px; background:#3a3a3f; }
#pr-nine .plan-preview .pp-safe { width:132px; background:var(--white); margin-top:1px; }
#pr-nine .plan-preview .pp-top { display:flex; gap:8px; justify-content:space-between; align-items:flex-start; }
#pr-nine .plan-preview h2, #pr-nine .plan-preview h3, #pr-nine .plan-preview p { margin:0; color:inherit; }
#pr-nine .plan-preview h2 { font-size:26px; line-height:1.15; font-weight:800; }
#pr-nine .plan-preview .pp-lead { color:var(--muted); margin-top:6px; }
#pr-nine .plan-preview .pp-x { flex:none; width:44px; height:44px; display:grid; place-items:center; margin:-7px -10px 0 0; }
#pr-nine .plan-preview .pp-x svg { width:23px; height:23px; }
#pr-nine .plan-preview .pp-options { display:grid; gap:8px; }
#pr-nine .plan-preview .pp-option { width:100%; display:grid; grid-template-columns:22px minmax(0,1fr) auto; align-items:center; gap:12px; text-align:left; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; }
#pr-nine .plan-preview .pp-option[aria-pressed=true] { border-color:#e8262f; background:#281417; }
#pr-nine .plan-preview .pp-dot { display:grid; place-items:center; width:22px; height:22px; border:2px solid #66666c; border-radius:50%; }
#pr-nine .plan-preview .pp-dot svg { display:none; width:13px; height:13px; }
#pr-nine .plan-preview .pp-option[aria-pressed=true] .pp-dot { background:var(--red); border-color:var(--red); }
#pr-nine .plan-preview .pp-option[aria-pressed=true] .pp-dot svg { display:block; }
#pr-nine .plan-preview .pp-name { display:flex; align-items:center; gap:5px 8px; flex-wrap:wrap; font-size:16px; font-weight:750; }
#pr-nine .plan-preview .pp-badge { background:var(--red); font-size:11px; padding:2px 8px; border-radius:20px; }
#pr-nine .plan-preview .pp-desc { color:var(--muted); display:block; font-size:13px; margin-top:2px; }
#pr-nine .plan-preview .pp-price { text-align:right; white-space:nowrap; }
#pr-nine .plan-preview .pp-price b { font-size:18px; font-weight:800; }
#pr-nine .plan-preview .pp-price small { display:block; color:var(--muted); font-size:12px; }
#pr-nine .plan-preview .pp-sheet[data-expanded=&quot;true&quot;] { min-height:610px; }
#pr-nine .plan-preview .pp-flow { display:grid; gap:12px; }
#pr-nine .plan-preview .pp-back { width:max-content; max-width:100%; min-height:44px; padding:0 4px 0 0; display:flex; align-items:center; gap:6px; color:var(--cyan); font-weight:650; }

&lt;script&gt;
(() =&gt; {

  });
  const form = root.querySelector(&#x27;#edit-player-profile&#x27;);

  const photoError = form.querySelector(&#x27;#photo-error&#x27;);
  const photoPicker = form.querySelector(&#x27;.photo-pick&#x27;);
  const remove = form.querySelector(&#x27;.photo-remove&#x27;);
  const preview = root.querySelector(&#x27;#edit-preview&#x27;);
  const networkForm = root.querySelector(&#x27;#edit-networks&#x27;);
  const networkOverlay = root.querySelector(&#x27;#network-overlay&#x27;);
  const previewOverlay = root.querySelector(&#x27;#preview-overlay&#x27;);
  const networkButton = form.querySelector(&#x27;#open-networks&#x27;);
  const previewButton = form.querySelector(&#x27;#open-profile-preview&#x27;);
  const phone = form.closest(&#x27;.phone&#x27;);
  const editorPanels = [...phone.children].filter(panel =&gt; !panel.classList.contains(&#x27;editor-overlay&#x27;));
  let activeOverlay;
  let returnFocus;
  const status = root.querySelector(&#x27;#profile-save-status&#x27;);
  const rules = {
    instagram: { label: &#x27;Instagram&#x27;, hosts: [&#x27;instagram.com&#x27;, &#x27;www.instagram.com&#x27;], path: /^\/[a-z0-9._]+\/?$/i, reserved: [&#x27;p&#x27;,&#x27;reel&#x27;,&#x27;reels&#x27;,&#x27;explore&#x27;,&#x27;stories&#x27;,&#x27;accounts&#x27;,&#x27;direct&#x27;,&#x27;about&#x27;] },
    tiktok: { label: &#x27;TikTok&#x27;, hosts: [&#x27;tiktok.com&#x27;, &#x27;www.tiktok.com&#x27;], path: /^\/@[a-z0-9._]+\/?$/i, reserved: [] },
    facebook: { label: &#x27;Facebook&#x27;, hosts: [&#x27;facebook.com&#x27;,&#x27;www.facebook.com&#x27;,&#x27;m.facebook.com&#x27;], path: /^\/[a-z0-9.]+\/?$/i, reserved: [&#x27;login&#x27;,&#x27;watch&#x27;,&#x27;marketplace&#x27;,&#x27;reel&#x27;,&#x27;share&#x27;,&#x27;groups&#x27;,&#x27;events&#x27;,&#x27;help&#x27;,&#x27;photo.php&#x27;,&#x27;story.php&#x27;,&#x27;share.php&#x27;] },
  };
  let selectedPhoto = &#x27;&#x27;;

  function setAvatar(container, src) {

  function check(field) {
    const rule = rules[field.name];

    let link = &#x27;&#x27;;

      try {
        const url = new URL(value);
        const slug = url.pathname.split(&#x27;/&#x27;)[1]?.toLowerCase();
        const fbId = field.name === &#x27;facebook&#x27; &amp;&amp; url.pathname === &#x27;/profile.php&#x27; &amp;&amp; /^\d+$/.test(url.searchParams.get(&#x27;id&#x27;) ?? &#x27;&#x27;);
        const account = rule.path.test(url.pathname) &amp;&amp; !rule.reserved.includes(slug);
        if (url.protocol === &#x27;https:&#x27; &amp;&amp; !url.username &amp;&amp; !url.password &amp;&amp; !url.port
            &amp;&amp; rule.hosts.includes(url.hostname) &amp;&amp; (fbId || account)) {
          link = url.origin + url.pathname + (fbId ? &#x27;?id=&#x27; + url.searchParams.get(&#x27;id&#x27;) : &#x27;&#x27;);

  }
  function closeOverlay() {

    activeOverlay = null;
