#pongrank-pendientes-torneos > [data-source="torneo"] .champion.champion-feature { display:grid; justify-items:center; gap:8px; padding:16px 12px 22px; background:radial-gradient(ellipse at center top,#483419,#161411 77%); border-color:#896735; }
#pongrank-pendientes-torneos > [data-source="torneo"] .champion-feature small { color:#ffd278; font-weight:700; }
#pongrank-pendientes-torneos > [data-source="torneo"] .champion-feature h2 { color:#fff; font-size:28px; }

#pongrank-pendientes-torneos > [data-source="torneo"] .draw-scroll { overflow:auto; max-height:470px; border:1px solid #3c3c42; border-radius:14px; background:#141417; scrollbar-color:#fff #262629; }
#pongrank-pendientes-torneos > [data-source="torneo"] .draw-graph { position:relative; isolation:isolate; }
#pongrank-pendientes-torneos > [data-source="torneo"] .draw-graph > svg { position:absolute; inset:0; width:100%; height:100%; max-width:none; pointer-events:none; }
#pongrank-pendientes-torneos > [data-source="torneo"] .draw-graph path { fill:none; stroke:#dddde2; stroke-width:1.3; }
#pongrank-pendientes-torneos > [data-source="torneo"] .draw-graph path.known { stroke:#8be2ac; stroke-width:2; }
#pongrank-pendientes-torneos > [data-source="torneo"] .draw-heading { position:absolute; top:10px; width:152px; text-align:center; color:#fff; font-size:12px; }
#pongrank-pendientes-torneos > [data-source="torneo"] .draw-node { box-sizing:border-box; position:absolute; transform:translateY(-50%); width:152px; min-height:66px; display:grid; align-content:center; gap:3px; border:1px solid #e7e7ea; border-radius:9px; background:#202024; color:#fff; padding:7px; font-size:11px; line-height:1.25; }
#pongrank-pendientes-torneos > [data-source="torneo"] .draw-node > b { font-size:11px; }
#pongrank-pendientes-torneos > [data-source="torneo"] .draw-node .muted { color:#d1d1d6; }
#pongrank-pendientes-torneos > [data-source="torneo"] .draw-node.played { border-color:#8be2ac; background:#17291f; }
#pongrank-pendientes-torneos > [data-source="torneo"] .draw-node .winner-line { color:#8be2ac; font-weight:700; }
#pongrank-pendientes-torneos > [data-source="torneo"] .draw-node.gold-final { border-color:#ffd278; color:#ffd278; background:#2b2318; }

#pongrank-pendientes-torneos .paired-draw { max-height:390px; touch-action:none; cursor:grab; }
#pongrank-pendientes-torneos .paired-draw .draw-node { transform:translateY(-50%); min-height:70px; }
#pongrank-pendientes-torneos .tournament-overlay[hidden] { display:none; }
#pongrank-pendientes-torneos .participant-actions { display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px;width:100%; }
#pongrank-pendientes-torneos .participant-actions .action { width:100%;min-width:0;white-space:nowrap;padding-inline:8px; }
#pongrank-pendientes-torneos .diagram-back { align-self:flex-start;background:none;border:0;font:inherit;color:#b9bbc1; }
#pongrank-pendientes-torneos [data-full-diagram][hidden] { display:none!important; }
#pongrank-pendientes-torneos .field .native-schedule { color-scheme:dark;width:100%;min-width:0;box-sizing:border-box;font-size:16px;accent-color:#22d3ee; }
#pongrank-pendientes-torneos .field .native-schedule:focus-visible { outline:2px solid #22d3ee;outline-offset:2px; }

<script>
(() => {
  const form = document.getElementById('pongrank-pendientes-torneos').querySelector('#crear-torneo-preview');
  const help = form.querySelector('[data-format-help]');
  form.addEventListener('change', (event) => {
    if (event.target.name !== 'format') return;
    const wins = (Number(event.target.value) + 1) / 2;
    help.textContent = `Gana quien consiga ${wins} sets. Cada set se juega a 11, con 2 puntos de ventaja.`;
  });
  form.addEventListener('submit', (event) => event.preventDefault());
})();
</script>
<script>
(() => {
  const root = document.getElementById('pongrank-pendientes-torneos');
  for (const board of root.querySelectorAll('[data-score-view]')) {
    const popup = board.querySelector('[data-ready-popup]');
    const variant = board.closest('[data-variant]');
    const score = board.querySelector('[data-own-score]');
    const opponent = [...board.querySelectorAll('[data-live-points]')].find(el => el !== score);
    const plus = board.querySelector('[data-score-point]');
    const undo = board.querySelector('[data-score-undo]');
    const status = board.querySelector('[data-set-status]');
    const initial = Number(score.textContent);
    const rivalPoints = Number(opponent.textContent);
    let points = initial;
    let shown = false;
    let timer;
    const dismiss = () => {
      clearTimeout(timer);
      popup.hidden = true;
    };
    const showReady = () => {
      if (variant.hidden) { dismiss(); return; }
      if (shown) return;
      shown = true;
      popup.hidden = false;
      timer = setTimeout(dismiss, 4200);
    };
    new MutationObserver(showReady).observe(variant, { attributes:true, attributeFilter:['hidden'] });
    showReady();
    const render = () => {
      const won = points >= 11 && points - rivalPoints >= 2;
      score.textContent = points;
      undo.disabled = points === initial;
      plus.disabled = won;
      status.hidden = !won;
      status.textContent = won ? 'Ganaste el set.' : '';
    };
    plus.addEventListener('click', () => { points++; render(); });
    undo.addEventListener('click', () => { points--; render(); });
    popup.querySelector('[data-dismiss-ready]').addEventListener('click', () => {
      dismiss();
      plus.focus();
    });
  }
  for (const actions of root.querySelectorAll('.readiness-actions')) {
    const screen = actions.closest('.phone');
    const ready = actions.querySelector('[data-ready-action]');
    const reject = actions.querySelector('[data-reject-match]');
    const right = actions.lastElementChild;
    const notice = screen.querySelector('.readiness-note');
    if (ready) ready.addEventListener('click', () => {
      const label = screen.querySelector('[data-my-ready]');
      label.textContent = 'Listo';
      label.classList.replace('neutral','green');
      ready.textContent = 'Esperando al rival';
      ready.classList.replace('primary','disabled');
      ready.disabled = true;
    });
    reject.addEventListener('click', () => {
      notice.hidden = false;
      reject.disabled = true;
      right.disabled = true;
    });
  }
})();

<script>
(() => {
  const root = document.getElementById('pongrank-pendientes-torneos');
  const screens = [...root.querySelectorAll(':scope > [data-variant]')];
  let backTo = 'Torneo · Participante';
  let matchBackTo = backTo;

  function center(viewport) {
    const final = viewport.querySelector('.gold-final').getBoundingClientRect();
    const rect = viewport.getBoundingClientRect();
    viewport.scrollLeft += final.left + final.width / 2 - rect.left - rect.width / 2;
    viewport.scrollTop += final.top + final.height / 2 - rect.top - rect.height / 2;
  }

  function reveal(name) {
    const destination = screens.find((screen) => screen.dataset.variant === name);
    if (!destination) return;
    const options = root.querySelectorAll('.viz-carousel-options > button');
    const choice = [...options].find((option) => option.textContent.trim() === name);
    if (choice) choice.click();
    else screens.forEach((screen) => { screen.hidden = screen !== destination; });
    const heading = destination.querySelector('h1');
    if (heading) {
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll:true });
    }
  }

  for (const viewport of root.querySelectorAll('.paired-draw')) {
    const screen = viewport.closest('[data-variant]');
    const onShow = () => {
      if (!screen.hidden && viewport.clientWidth) requestAnimationFrame(() => center(viewport));
    };
    new MutationObserver(onShow).observe(screen, { attributes:true, attributeFilter:['hidden'] });
    onShow();
    let drag;
    viewport.onpointerdown = (event) => {
      if (event.button !== 0) return;
      drag = { x:event.clientX, y:event.clientY, left:viewport.scrollLeft, top:viewport.scrollTop };
      viewport.setPointerCapture(event.pointerId);
    };
    viewport.onpointermove = (event) => {
      if (!drag) return;
      viewport.scrollLeft = drag.left + drag.x - event.clientX;
      viewport.scrollTop = drag.top + drag.y - event.clientY;
    };
    viewport.onpointerup = viewport.onpointercancel = viewport.onlostpointercapture = () => { drag = null; };
  }

  root.querySelector('[data-dismiss-published]').onclick = (event) => {
    const popup = event.currentTarget.closest('.tournament-overlay');
    popup.hidden = true;
    popup.closest('[data-variant]').querySelector('[data-screen]').focus();
  };

  root.querySelector('[data-dismiss-notice]').onclick = (event) => {
    event.currentTarget.closest('.tournament-overlay').hidden = true;
  };

  root.addEventListener('click', (event) => {
    const button = event.target.closest('[data-screen], [data-diagram-back], [data-match-back]');
    if (!button) return;
    if (button.hasAttribute('data-diagram-back')) {
      reveal(backTo);
      return;
    }
    if (button.hasAttribute('data-match-back')) {
      reveal(matchBackTo);
      return;
    }
    if (button.dataset.screen === 'Partida · Marcar listo') {
      matchBackTo = button.closest('[data-variant]').dataset.variant;
    }
    if (button.dataset.diagramState) {
      backTo = button.closest('[data-variant]').dataset.variant;
      for (const panel of root.querySelectorAll('[data-full-diagram]')) {
        panel.hidden = panel.dataset.fullDiagram !== button.dataset.diagramState;
      }
    }
    reveal(button.dataset.screen);
  });
})();
</script>

      canvas.width = 1080;

      floor.addColorStop(1, '#481120');

      glow.addColorStop(0, '#805522');

      glow.addColorStop(1, '#18101200');

      ctx.lineWidth = 3;
      ctx.strokeRect(76, 172, 928, 1576);
      ctx.drawImage(picture, 137, 373, 650, 650);

        ctx.fillStyle = color;

(() => {
  let positioningReady = window.FloatingUIDOM
    ? Promise.resolve(window.FloatingUIDOM)
    : null;
  const loadScript = (src) => new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = src;
    script.onload = resolve;
    script.onerror = () => {
      script.remove();
      reject(new Error("Could not load tooltip positioning"));
    };

  });
  const loadPositioning = async () => {
    const domUrl = "https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js";
    const preload = document.createElement("link");
    preload.rel = "preload";
    preload.as = "script";
    preload.href = domUrl;
    document.head.appendChild(preload);
    try {
      if (window.FloatingUICore == null) {
        await loadScript("https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js");
      }
      await loadScript(domUrl);
      return window.FloatingUIDOM;
    } finally {
      preload.remove();
    }
  };

    positioningReady = null;
    throw error;
  });
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";

    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";

    autoUpdateCleanup = null;

    activeTrigger = null;

      skipDelayUntil = Date.now() + skipDelay;

        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

              `${Math.max(0, availableWidth)}px`,
            );

      strategy: "fixed",

      .then(({ x, y }) => {

        floating.style.visibility = "visible";

      .catch(() => {

      });

    const content = getContent(trigger);

      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    const request = positionRequest;
    void getPositioning().then((positioning) => {
      if (request !== positionRequest || !trigger.isConnected) return;
      autoUpdateCleanup = positioning.autoUpdate(trigger, floating, () => {
        updatePosition(trigger, floating, positioning);
      });
    }).catch(() => {
      if (request === positionRequest) closeTooltip(false);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }

      immediate || activeTrigger != null || Date.now() < skipDelayUntil

      event.type === "pointerdown" && event.pointerType === "touch";
  };

    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };

    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();

<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();

          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
